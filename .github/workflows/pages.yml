name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: site
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          name="${{ github.event.repository.name }}"
          if [ "$name" = "$owner.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$name" >> "$GITHUB_OUTPUT"
            echo "url=https://$owner.github.io/$name" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run pages:build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
